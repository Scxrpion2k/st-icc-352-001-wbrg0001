<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Agregar Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h2>Agregar Producto</h2>

    <form action="/productos/crear" method="post">

        <div class="mb-3">
            <label>Nombre</label>
            <input type="text" name="nombre" class="form-control" placeholder="Nombre del producto">
        </div>

        <div class="mb-3">
            <label>Precio</label>
            <input type="text" name="precio" class="form-control" placeholder="Precio">
        </div>

        <button type="submit" class="btn btnGuardarProducto">
            Guardar producto
        </button>

        <a href="/Pagina_principal/administrar_producto" class="btn btnCancelarProducto">
            Cancelar
        </a>

    </form>

</div>

</body>
</html>
