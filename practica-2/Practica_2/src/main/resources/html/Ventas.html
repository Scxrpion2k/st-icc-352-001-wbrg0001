<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Productos</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>


<nav class="navbar navbar-dark bg-dark px-3">

    <span class="navbar-brand">WAF</span>
    <a class="btn btn-primary" th:href="@{/Pagina_principal}">
        Volver
    </a>

</nav>


<div class="container mt-4">

    <div class="row">
        <div class="col d-flex justify-content-between align-items-center">
            <h2 class="mb-0">Ventas</h2>


        </div>
    </div>


    <div class="row mt-3">
        <div class="col">

            <table class="table table-striped table-hover">

                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Fecha de compra</th>
                    <th>Nombre del cliente</th>
                    <th>Productos</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="venta : ${ventas}">
                    <td th:text="${venta.id}"></td>
                    <td th:text="${venta.fechaCompra}"></td>
                    <td th:text="${venta.nombreCliente}"></td>
                    <td>
                        <span th:each="producto, stat : ${venta.listaProductos}">
                            <span th:text="${producto.nombre}"></span>
                            <span th:if="${!stat.last}">, </span>
                        </span>
                    </td>

                </tr>

                </tbody>

            </table>

        </div>
    </div>

</div>

</body>
</html>
