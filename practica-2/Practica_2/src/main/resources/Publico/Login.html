<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-4">

            <div class="card">

                <div class="card-body">

                    <h3 class="text-center mb-4">Iniciar Sesión</h3>

                    <form action="/login" method="post">

                        <div class="mb-3">
                            <input
                                    type="text"
                                    name="usuario"
                                    class="form-control"
                                    placeholder="Usuario"
                                    required>
                        </div>

                        <div class="mb-3">
                            <input
                                    type="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="Contraseña"
                                    required>
                        </div>

                        <button
                                type="submit"
                                class="btn btn-primary w-100">
                            Entrar
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
