<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="/publico/hoja.css">
</head>
<body>

<div class="contenedor">

    <h2>Iniciar Sesion</h2>

    <form action="/procesar-login" method="post">

        <input
                type="text"
                name="usuario"
                placeholder="Usuario">

        <input
                type="password"
                name="password"
                placeholder="Contrasena">

        <button type="submit">
            Entrar
        </button>

    </form>

</div>

</body>
</html>
